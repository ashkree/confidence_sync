name: confidence-sync

volumes:
  postgres_data:
  backend_venv:
  cognito_data:
  frontend_node_modules:
  s3_data:
  ollama-data:

services:

  # --- Ollama: local model inference for AI functions --- 
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # --- Postgres: local stand-in for RDS ---
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-confidence_sync}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-confidence_sync}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Cognito local ---
  cognito-local:
    image: jagregory/cognito-local:latest
    ports:
      - "9229:9229"
    volumes:
      - cognito_data:/app/.cognito   # persists users/pools across restarts, path depends on your setup
    restart: unless-stopped
  

  # --- s3mock ---
  s3mock:
    image: adobe/s3mock:latest
    environment:
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=it_manuals,hr_policies
      - COM_ADOBE_TESTING_S3MOCK_STORE_ROOT=containers3root
      - COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT=true
    ports:
      - "9090:9090"
    volumes:
      - s3_data:/containers3root
  
  # --- bedrock-mock ---
  bedrock-mock:
    image: bedrock-mock:latest
    ports:
      - "3000:3000"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  # --- FastAPI backend ---
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
      - ./.env   # loaded second, overrides DB_URL
    environment:
      # Internal service-to-service hostnames (Docker DNS), not localhost.
      DB_URL: ${DB_URL:-postgresql+psycopg://app:app@postgres:5432/confidence_sync}
      COGNITO_ENDPOINT_URL: ${COGNITO_ENDPOINT_URL:-http://cognito-local:9229}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      cognito-local:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  # --- FastAPI backend ---
  frontend:
    build: 
      context: ./frontend 
    env_file:
      - ./frontend/.env
      - ./.env   # loaded second, overrides DB_URL
    ports: 
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend: 
        condition: service_healthy
    restart: unless-stopped


