name: confidence-sync

services:
  # --- Postgres: local stand-in for RDS ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-confidence_sync}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-confidence_sync}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Cognito local ---
  cognito-local:
    image: jagregory/cognito-local:latest
    ports:
      - "9229:9229"
    volumes:
      - cognito_data:/app/.cognito   # persists users/pools across restarts, path depends on your setup
    restart: unless-stopped
  
  # --- FastAPI backend ---
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
      - ./.env   # loaded second, overrides DB_URL
    environment:
      # Internal service-to-service hostnames (Docker DNS), not localhost.
      DB_URL: ${DB_URL:-postgresql+psycopg://app:app@postgres:5432/confidence_sync}
      COGNITO_ENDPOINT_URL: ${COGNITO_ENDPOINT_URL:-http://cognito-local:9229}
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      cognito-local:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend 
    env_file:
      - ./frontend/.env
      - ./.env   # loaded second, overrides DB_URL
    ports: 
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend: 
        condition: service_healthy
    restart: unless-stopped


volumes:
  postgres_data:
  backend_venv:
  cognito_data:
  frontend_node_modules:
